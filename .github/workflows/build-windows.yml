# Build CKAN for Windows (ckan.exe + AutoUpdater.exe)
#
# Runs on windows-latest where the .NET Framework 4.8.1 reference
# assemblies and Windows desktop targeting packs are preinstalled.
# This sidesteps the Linux/mono MSBuild routing problem that has
# been breaking build.yml's net481 WPF projects since the GitHub
# runner image migrated to .NET 10.
#
# Triggered by:
#   - push to main with src-ui/, CKAN/, or build/ changes
#   - manual workflow_dispatch
#   - new tag matching v*
#   - the existing release.yml via workflow_call (future work)
#
# Output:
#   - Workflow artifact: ckan-windows-<run_id> containing
#     ckan.exe and AutoUpdater.exe from _build/repack/Release/

name: Build CKAN Windows

on:
  push:
    branches: [main]
    paths:
      - 'src-ui/**'
      - 'CKAN/**'
      - 'Core/**'
      - 'Cmdline/**'
      - 'GUI/**'
      - 'Netkan/**'
      - 'Tests/**'
      - 'build/**'
      - 'build.ps1'
      - 'build.sh'
      - 'GlobalAssemblyInfo.cs'
      - 'CKAN.sln'
      - 'packages.config'
      - 'CKAN.schema'
      - 'NetKAN.schema'
      - '.github/workflows/build-windows.yml'
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ckan.exe on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      Configuration: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ─── Frontend (React + TypeScript + Vite) ───
      # Same logic as the new frontend-ci.yml: build the Vite output
      # so CKAN/wwwroot exists before the .NET build bundles it.
      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src-ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: src-ui
        run: npm ci

      - name: Build frontend (Vite → CKAN/wwwroot)
        working-directory: src-ui
        run: npm run build

      - name: Verify wwwroot was produced
        shell: pwsh
        run: |
          if (-not (Test-Path 'CKAN/wwwroot/index.html')) {
            Write-Error 'CKAN/wwwroot/index.html missing after Vite build'
            exit 1
          }

      # ─── .NET SDK ───
      # Pin to 8.0. The Windows runner image usually ships a newer
      # SDK by default, but Cake's net8.0 target was authored
      # against 8.0 and may have differences on later SDKs.
      - name: Setup .NET SDK 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # ─── .NET build via Cake (Windows entry point) ───
      - name: Run Cake build
        shell: pwsh
        run: |
          .\build.ps1 --target=Default --configuration=$env:Configuration --verbosity=Minimal

      - name: Verify ckan.exe was produced
        shell: pwsh
        run: |
          $exe = "_build\repack\$env:Configuration\ckan.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Expected $exe but it was not produced"
            Get-ChildItem -Recurse _build | Select-Object -First 50 | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          $size = (Get-Item $exe).Length
          Write-Host "ckan.exe: $exe ($size bytes)"

      # ─── Artifacts ───
      # ckan.exe is the main deliverable. AutoUpdater.exe ships with
      # it and is used by the in-app update flow. The Lite build is
      # ~9MB, the bundled one is ~71MB; both fit easily in a 7-day
      # artifact retention.
      - name: Upload ckan.exe
        uses: actions/upload-artifact@v4
        with:
          name: ckan-windows
          path: _build/repack/${{ env.Configuration }}/ckan.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload AutoUpdater.exe
        uses: actions/upload-artifact@v4
        with:
          name: ckan-windows-autoupdater
          path: _build/repack/${{ env.Configuration }}/AutoUpdater.exe
          if-no-files-found: warn
          retention-days: 7

      - name: Upload full repack directory
        uses: actions/upload-artifact@v4
        with:
          name: ckan-windows-repack
          path: _build/repack/${{ env.Configuration }}/
          retention-days: 3

      # ─── Summary ───
      - name: Build summary
        if: always()
        shell: pwsh
        run: |
          $exe = "_build\repack\$env:Configuration\ckan.exe"
          if (Test-Path $exe) {
            $info = Get-Item $exe
            $sha = (Get-FileHash $exe -Algorithm SHA256).Hash
            $summary = @"
          ## ckan.exe

          - Path: ``$exe``
          - Size: $('{0:N0}' -f $info.Length) bytes
          - SHA256: ``$sha``
          "@
            $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } else {
            "## ckan.exe was not produced" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
