# Build CKAN for Windows (CKAN-M.exe + CKAN-M-bundled.exe + AutoUpdater.exe)
#
# Runs on windows-latest where the .NET Framework 4.8.1 reference
# assemblies and Windows desktop targeting packs are preinstalled.
# This sidesteps the Linux/mono MSBuild routing problem that has
# been breaking build.yml's net481 WPF projects since the GitHub
# runner image migrated to .NET 10.
#
# Produces two CKAN-M.exe variants that match the build-30 release
# layout:
#   - CKAN-M.exe         ~9 MB, framework-dependent, net8.0-windows
#   - CKAN-M-bundled.exe ~70 MB, self-contained, win-x64 single-file
# Plus AutoUpdater.exe and the Cake repack directory as debug
# artifacts.
#
# Triggered by:
#   - push to main with src-ui/, CKAN/, or build/ changes
#   - manual workflow_dispatch
#   - new tag matching v*
#
# Output:
#   - Workflow artifacts: ckan-windows (CKAN-M.exe lite),
#     ckan-windows-bundled (CKAN-M-bundled.exe),
#     ckan-windows-autoupdater (AutoUpdater.exe),
#     ckan-windows-repack (full Cake repack directory)
#   - On tag pushes: also publishes all three exes to the matching
#     GitHub release (creates it if missing).
#   - On tag pushes: also publishes both lite and bundled binaries
#     to the matching GitHub release (creates it if missing).

name: Build CKAN Windows

on:
  push:
    branches: [main]
    paths:
      - 'src-ui/**'
      - 'CKAN/**'
      - 'Core/**'
      - 'Cmdline/**'
      - 'GUI/**'
      - 'Netkan/**'
      - 'Tests/**'
      - 'build/**'
      - 'build.ps1'
      - 'build.sh'
      - 'GlobalAssemblyInfo.cs'
      - 'CKAN.sln'
      - 'packages.config'
      - 'CKAN.schema'
      - 'NetKAN.schema'
      - '.github/workflows/build-windows.yml'
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build ckan.exe on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      Configuration: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ─── Frontend (React + TypeScript + Vite) ───
      # Same logic as the new frontend-ci.yml: build the Vite output
      # so CKAN/wwwroot exists before the .NET build bundles it.
      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src-ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: src-ui
        run: npm ci

      - name: Build frontend (Vite → CKAN/wwwroot)
        working-directory: src-ui
        run: npm run build

      - name: Verify wwwroot was produced
        shell: pwsh
        run: |
          if (-not (Test-Path 'CKAN/wwwroot/index.html')) {
            Write-Error 'CKAN/wwwroot/index.html missing after Vite build'
            exit 1
          }

      # ─── .NET SDK ───
      # Pin to 8.0. The Windows runner image usually ships a newer
      # SDK by default, but Cake's net8.0 target was authored
      # against 8.0 and may have differences on later SDKs.
      - name: Setup .NET SDK 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # ─── .NET build via Cake (Windows entry point) ───
      # Cake does the heavy lifting: it builds Core, Netkan, Cmdline,
      # the .NET 8 targets via the dotnet SDK, the net481 WPF shell
      # via MSBuild, runs unit tests, ILRepack-merges dependencies
      # into ckan.exe, and assembles the repack directory. This is
      # the project's canonical build path.
      - name: Run Cake build
        shell: pwsh
        run: |
          .\build.ps1 --target=Default --configuration=$env:Configuration --verbosity=Minimal

      - name: Verify repack was produced
        shell: pwsh
        run: |
          $dir = "_build\repack\$env:Configuration"
          if (-not (Test-Path $dir)) {
            Write-Error "Expected $dir but it was not produced"
            Get-ChildItem -Recurse _build | Select-Object -First 50 | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          Get-ChildItem $dir | ForEach-Object { Write-Host ("  {0:N0} bytes  {1}" -f $_.Length, $_.Name) }

      # Rename Cake's repack ckan.exe to CKAN-M.exe to match the
      # build-30 release asset name. The In-app UpdateChecker
      # (CKAN/IPC/UpdateChecker.cs) looks for CKAN-M.exe in the
      # release for self-updates. The Cake repack ckan.exe IS
      # the same modernized UI as the bundled, just compiled
      # to .NET Framework 4.8.1 via ILRepack -- it works on
      # Windows 10+ without installing any .NET runtime.
      - name: Stage Cake repack ckan.exe as CKAN-M.exe (lite)
        shell: pwsh
        run: |
          $src  = "_build\repack\$env:Configuration\ckan.exe"
          $dest = "_build\repack\$env:Configuration\CKAN-M.exe"
          if (Test-Path $src) {
            Copy-Item $src $dest -Force
            $size = (Get-Item $dest).Length
            Write-Host "Lite: $dest ($size bytes)"
          } else {
            Write-Error "Cake repack did not produce $src"
            exit 1
          }

      # ─── Bundled (self-contained) build ───
      # `dotnet publish` with --self-contained produces a ~70 MB
      # exe with the .NET runtime embedded. No .NET install
      # required on the target machine. This is the modernized
      # CKAN-M UI built to net8.0-windows, single-file.
      - name: Publish bundled (self-contained) ckan.exe
        shell: pwsh
        run: |
          $publishDir = "CKAN\bin\$env:Configuration\net8.0-windows\win-x64\publish"
          if (Test-Path $publishDir) {
            Remove-Item -Recurse -Force $publishDir
          }
          dotnet publish CKAN/CKAN-Modern.csproj `
            --configuration $env:Configuration `
            --runtime win-x64 `
            --self-contained true `
            --output "$publishDir" `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            --verbosity Minimal

      - name: Verify bundled ckan.exe was produced
        shell: pwsh
        run: |
          $exe = "CKAN\bin\$env:Configuration\net8.0-windows\win-x64\publish\CKAN-M.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Expected $exe but it was not produced"
            Get-ChildItem -Recurse CKAN\bin\$env:Configuration | Select-Object -First 50 | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          $size = (Get-Item $exe).Length
          Write-Host "Bundled CKAN-M.exe: $exe ($size bytes)"

      # Rename bundled output to match the asset name that the
      # in-app UpdateChecker looks for. UpdateChecker.cs line 75:
      #   if (assetName.Equals("CKAN-M-bundled.exe", ...))
      - name: Stage bundled as CKAN-M-bundled.exe
        shell: pwsh
        run: |
          $src  = "CKAN\bin\$env:Configuration\net8.0-windows\win-x64\publish\CKAN-M.exe"
          $dest = "CKAN\bin\$env:Configuration\net8.0-windows\win-x64\publish\CKAN-M-bundled.exe"
          if (Test-Path $src) {
            Copy-Item $src $dest -Force
            $size = (Get-Item $dest).Length
            Write-Host "Bundled: $dest ($size bytes)"
          }

      # ─── Artifacts ───
      # Asset names match the build-30 release:
      #   CKAN-M.exe         (lite, framework-dependent, net481)
      #   CKAN-M-bundled.exe (self-contained, net8.0-windows, ~70 MB)
      #   AutoUpdater.exe    (in-app update helper, ~40 KB)
      - name: Upload CKAN-M.exe (lite, Cake repack)
        uses: actions/upload-artifact@v4
        with:
          name: ckan-windows
          path: _build/repack/${{ env.Configuration }}/CKAN-M.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload CKAN-M-bundled.exe (self-contained)
        uses: actions/upload-artifact@v4
        with:
          name: ckan-windows-bundled
          path: CKAN/bin/${{ env.Configuration }}/net8.0-windows/win-x64/publish/CKAN-M-bundled.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload AutoUpdater.exe
        uses: actions/upload-artifact@v4
        with:
          name: ckan-windows-autoupdater
          path: _build/repack/${{ env.Configuration }}/AutoUpdater.exe
          if-no-files-found: warn
          retention-days: 7

      - name: Upload full repack directory
        uses: actions/upload-artifact@v4
        with:
          name: ckan-windows-repack
          path: _build/repack/${{ env.Configuration }}/
          retention-days: 3

      # ─── Summary ───
      - name: Build summary
        if: always()
        shell: pwsh
        run: |
          $lite  = "_build\repack\$env:Configuration\CKAN-M.exe"
          $bundled = "CKAN\bin\$env:Configuration\net8.0-windows\win-x64\publish\CKAN-M-bundled.exe"
          $summary = @"
          ## CKAN-M build summary

          ### Lite (framework-dependent, .NET Framework 4.8.1)
          "@
          if (Test-Path $lite) {
            $info = Get-Item $lite
            $sha = (Get-FileHash $lite -Algorithm SHA256).Hash
            $summary += @"

          - Path: ``$lite``
          - Size: $('{0:N0}' -f $info.Length) bytes
          - SHA256: ``$sha``
          - Runtime: .NET Framework 4.8.1 (built into Windows 10+)
          - Architecture: bundled via ILRepack
          "@
          } else {
            $summary += "`n- NOT PRODUCED`n"
          }
          $summary += @"

          ### Bundled (self-contained, net8.0-windows win-x64)
          "@
          if (Test-Path $bundled) {
            $info = Get-Item $bundled
            $sha = (Get-FileHash $bundled -Algorithm SHA256).Hash
            $summary += @"

          - Path: ``$bundled``
          - Size: $('{0:N0}' -f $info.Length) bytes
          - SHA256: ``$sha``
          - Runtime: .NET 8 desktop (no install required)
          - Architecture: x86-64 single-file
          "@
          } else {
            $summary += "`n- NOT PRODUCED`n"
          }
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  # ─── Publish to release ───
  # On a tag push (refs/tags/v*), download both binaries and attach
  # them to the matching GitHub release. Creates the release if it
  # doesn't exist yet.
  publish:
    name: Attach binaries to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download CKAN-M.exe (lite)
        uses: actions/download-artifact@v5
        with:
          name: ckan-windows
          path: artifacts/lite/

      - name: Download CKAN-M-bundled.exe
        uses: actions/download-artifact@v5
        with:
          name: ckan-windows-bundled
          path: artifacts/bundled/

      - name: Download AutoUpdater.exe
        uses: actions/download-artifact@v5
        with:
          name: ckan-windows-autoupdater
          path: artifacts/autoupdater/

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG does not exist; creating it"
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "${{ github.event.repository.name }} ${TAG}" \
              --generate-notes
          else
            echo "Release $TAG already exists; will upload assets"
          fi

      - name: Upload binaries to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # The in-app UpdateChecker looks for these exact asset names.
          # See CKAN/IPC/UpdateChecker.cs around the asset name match.
          # Local filenames must be the short names (no directory
          # prefix), because gh release upload uses the basename of
          # each path as the asset name on the release.
          cp artifacts/lite/CKAN-M.exe         CKAN-M.exe
          cp artifacts/bundled/CKAN-M-bundled.exe CKAN-M-bundled.exe
          cp artifacts/autoupdater/AutoUpdater.exe   AutoUpdater.exe
          gh release upload "$TAG" \
            CKAN-M.exe \
            CKAN-M-bundled.exe \
            AutoUpdater.exe \
            --clobber

      - name: Verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" --json assets \
            --jq '.assets[] | "  - " + .name + "  (" + (.size / 1024 / 1024 | tostring | .[0:5]) + " MB)"'
